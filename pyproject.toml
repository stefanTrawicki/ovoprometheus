[project]
name = "ovoprometheus"
version = "0.1.0"
description = "Prometheus exporter for OVO Energy usage data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "ovoenergy>=3.0.0",
    "prometheus-client>=0.20",
]

[project.scripts]
ovo-prometheus = "ovo_prometheus.exporter:run"

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovo_prometheus"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
